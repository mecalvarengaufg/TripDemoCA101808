<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">
    <link rel="icon" href="favicon.ico">

    <title>TripApp | Lista de Categorias.</title>
    <!-- Bootstrap core CSS -->
    <link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <!-- Custom styles for this template -->
    <link th:href="@{/bootstrap/css/jumbotron.css}" rel="stylesheet">
    <link th:href="@{/bootstrap/css/sticky-footer-navbar.css}" rel="stylesheet">
    <!-- FontAwesome Icons -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  </head>
<body>
	<header th:insert="fragments/menu :: menu-principal"></header>
    <main role="main">   
    	<div class="card-body">
    		<a class="btn btn-primary" th:href="@{/categorias/create}" role="button"><i class="fas fa-file" aria-hidden="true"></i>Nueva</a>
    		<hr>
    		<div th:if="${msg != null}" class='alert alert-success' th:text="${msg}" role='alert'></div>
    		<table class="table table-hover">
    			<thead class="thead-light">
    			<tr>
    			<th scope="col">Id</th>
    			<th scope="col">Nombre</th>
    			<th scope="col">Descripcion</th>
    			<th scope="col">Operaciones</th>
    			</tr>
    			</thead>
    			<tbody>
    			<tr th:each="cat : ${categorias}">
    				<th scope="row" th:text="${cat.id}"></th>
    				<td th:text="${cat.nombre}"></td>
    				<td th:text="${cat.descripcion}"></td>
    				<td>
    					<a href="#" class="btn btn-success btn-sn" role="button" title="Editar"><i class="fas fa-pencil-alt fa-sm" aria-hidden="true"></i></a>
    					<a href="#" onclick="return confirm('¿Estas seguro?')" class="btn btn-success btn-sm" role="button" title="Eliminar"><i class="fas fa-trash fa-sm" aria-hidden="true"></i></a>
    				</td>		
    			</tr>
    			</tbody>
    		</table>
    	</div>
    </main>
    <footer th:insert="fragments/footer :: pie-pagina"></footer>

    <!-- Bootstrap core JavaScript
    ================================================== -->
    <!-- Placed at the end of the document so the pages load faster -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script th:src="@{/bootstrap/js/bootstrap.min.js}"></script>    
</body>
</html>
