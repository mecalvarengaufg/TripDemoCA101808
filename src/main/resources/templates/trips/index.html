<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="ISO-8859-1">
<title>Trips - CA101808</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
<!-- Bootstrap core CSS -->
<link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
<!-- Custom styles for this template -->
<link th:href="@{/bootstrap/css/jumbotron.css}" rel="stylesheet">
<link th:href="@{/bootstrap/css/sticky-footer-navbar.css}" rel="stylesheet">

</head>
<body>

<header th:insert="fragments/menu :: menu-principal"></header>

    <div class="container mt-4">
        <!-- Botón nuevo -->
        <a th:href="@{/trips/create}" class="btn btn-primary mb-3">Nuevo</a>

        <!-- Tabla de trips -->
        <div th:if="${msg != null}" class='alert alert-success' th:text="${msg}" role='alert'></div>
        <table class="table table-striped">
            <thead class="thead-dark">
                <tr>
                    <th>Categoria</th>
                    <th>Nombre</th>
                    <th>Fecha Publicación</th>
                    <th>Estatus</th>
                    <th>Destacada</th>
                    <th>Editar/Borrar</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="trip : ${trips}">
                    <td th:text="${trip.categoria.nombre}"></td>
                    <td th:text="${trip.nombre}"></td>
                    <td th:text="${trip.fecha}"></td>
                    <td th:text="${trip.estatus}"></td>
                    <td th:text="${trip.destacado == 1 ? 'SI' : 'NO'}"></td>
                    <td>
                        <a th:href="@{'/trips/view/' + ${trip.id}}" class="btn btn-success btn-sm">Editar</a>
                        <a th:href="@{'/trips/delete?id=' + ${trip.id}}" class="btn btn-danger btn-sm">Borrar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    
<footer th:insert="fragments/footer :: pie-pagina"></footer>

    <!-- Bootstrap core JavaScript
    ================================================== -->
    <!-- Placed at the end of the document so the pages load faster -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="bootstrap/js/bootstrap.min.js"></script>
    <script th:src="@{/bootstrap/js/bootstrap.min.js}"></script>  
</body>
</html>
