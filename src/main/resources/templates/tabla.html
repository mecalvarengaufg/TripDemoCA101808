<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="ISO-8859-1">
<title>Trips - CA101808</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
</head>
<body>
	<img th:src="@{images/logo.png}" width="145" height="136">
	<h1>Trips en El Salvador - Mario Corpeno - CA101808</h1>
	<table class="table table-hover">
		<tr>
			<td>Foto</td> <!-- Actividad 1 Unidad 2 -->
			<td>ID</td>
			<td>Nombre</td>
			<td>Fecha de publicacion</td>
			<td>Costo</td>
			<td>Descripcion</td>
			<td>Destacado</td>
			<!-- Se agrega a la tabla la columna de calificacion Parcial1-->
			<!--<td>Calificacion</td> Se deshabilita en la Actividad 1 Unidad 2-->
			<td>Detalle</td>
			<td>Eliminar</td>
			
		</tr>
		<tr th:each="trip : ${trips}">
		<td><!-- Actividad 1 Unidad 2 -->
			<img th:src="@{/images/{img} (img=${trip.imagen})}" width="100" height="100">
		</td><!-- Actividad 1 Unidad 2 -->
		<td th:text="${trip.id}"></td>
		<td th:text="${trip.nombre}"></td>
		<td th:text="${trip.fecha}"></td>
		<td th:text="${trip.costo}"></td>
		<td th:text="${trip.descripcion}"></td>
		<!-- <td th:text="${trip.destacado == 1? 'Si' : 'No'}"></td> -->	
		<td>
			<span th:if="${trip.destacado == 1}" class="badge bg-success">Si</span>
			<span th:unless="${trip.destacado == 1}" class="badge bg-danger">No</span>
		<td>
		<a th:href="@{/trips/view/{id} (id=${trip.id}) }" class="btn btn-success">Detalle</a>
		<!-- Se agrega la condicional para la calificacion-->
	<!--<span th:if="${trip.calificacion >= 6}" class="badge bg-success">
    <span th:text="${trip.calificacion}"></span>
	</span> Se deshabilita en la Actividad 1 Unidad 2-->

	<!--<span th:unless="${trip.calificacion >= 6}" class="badge bg-danger">
    <span th:text="${trip.calificacion}"></span>
	</span>   Se deshabilita en la Actividad 1 Unidad 2-->
		</td>
		<!-- Se agrega para la Actividad 1 Unidad 2 -->
		<td>
		<a th:href="@{/trips/delete(id=${trip.id}) }" class="btn btn-danger">Eliminar</a>
		</td>
		</tr>
	</table>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
</body>
</html>
